name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  uv-validation:
    name: uv run validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run documented validation command
        run: UV_CACHE_DIR=.uv-cache uv run python -m unittest discover -s tests -v

  validate-skills:
    name: Validate skill format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Validate every skill is loadable
        run: python scripts/validate_skills.py
      - name: Verify skills install flatly (dry run)
        run: python scripts/install_skills.py --agent claude --dry-run

  structsense-resource-catalog:
    name: StructSense resource catalog tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --quiet 'rdflib>=7,<8' 'pyshacl>=0.26' 'jsonschema>=4' 'pytest>=8'
      - name: Test source-backed resource conversion
        run: python -m pytest skills/structsense/scripts/tests/test_resource_catalog.py -q

  extraction-core-schema:
    name: Extraction Core schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LinkML
        run: python -m pip install --quiet 'linkml>=1.9,<2'
      - name: Lint the schema
        run: linkml-lint --config schemas/extraction_core/.linkmllint.yaml schemas/extraction_core/extraction_core.yaml
      - name: Generate JSON Schema and OWL
        run: |
          gen-json-schema schemas/extraction_core/extraction_core.yaml > /tmp/extraction_core.schema.json
          gen-owl schemas/extraction_core/extraction_core.yaml > /tmp/extraction_core.owl.ttl
      - name: Validate the example dataset
        run: python schemas/extraction_core/check_dataset.py schemas/extraction_core/examples/ExtractionDataset-*.yaml
      - name: Schema tests
        run: python -m unittest tests.test_extraction_core -v

  duct-skill-smoke:
    name: duct skill smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install con-duct
        run: python -m pip install --quiet con-duct
      - name: Capture a command with duct
        run: |
          mkdir -p .duct-ci
          duct --s-i 0.1 --r-i 0.1 -p .duct-ci/run_ -- python -c "x=[0]*1000000; print('ok')"
      - name: Summarize the run for review
        run: |
          python skills/duct/scripts/summarize_run.py .duct-ci/run_info.json
          python skills/duct/scripts/summarize_run.py .duct-ci/ --json
