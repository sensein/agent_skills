# INVALID on purpose: schema-valid, but breaks the cross-record provenance
# rules enforced by check_dataset.py.
id: ex:dataset/broken-references
skill_versions:
  - id: ex:skill/structsense/0.12.0
    skill_name: structsense
    skill_version: 0.12.0
model_versions:
  - id: ex:model/model-a
    model_identifier: model-a
  - id: ex:model/model-b
    model_identifier: model-b
documents:
  - id: ex:paper/p1
extraction_runs:
  - id: ex:run/r1
    task_type: ner
    skill: ex:skill/structsense/0.12.0
    models: [ex:model/model-a]
entity_mentions:
