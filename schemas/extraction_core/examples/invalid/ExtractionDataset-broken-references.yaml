    paper_id: ex:paper/p1
    surface_form: CA1
    entity_category: BrainRegion
    generated_by: ex:run/r1
    extracted_by: ex:model/model-b
  # ungrounded record marked accepted, plus an unverified accepted mapping
  - id: ex:mention/m3
    paper_id: ex:paper/p1
    surface_form: dentate gyrus
    entity_category: BrainRegion
    generated_by: ex:run/r1
    evidence_verification: not_found
    record_status: accepted
    concept_mappings:
      - mapped_curie: UBERON:0001885
        mapping_status: accepted
        alignment_method: model_proposed_unverified
