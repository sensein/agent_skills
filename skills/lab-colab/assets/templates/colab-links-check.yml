# Validates the fenced ```links block in issue bodies and comments on errors.
# Rendered by `colab.py render-forms --workflows` from the config's [edges]; do not hand-edit.
name: colab-links-check
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate links block
        id: v
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          ALLOWED = set({{BODY_EDGES}})
          NATIVE = set({{NATIVE_EDGES}})
          KG_ONLY = set({{KG_EDGES}})
          BLOCK = re.compile(r"```links\s*\n(.*?)```", re.S)
          LINE = re.compile(r"^\s*(?P<edge>[a-z][a-z-]*)\s*:\s*(?P<target>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#\d+|kg:[A-Za-z0-9_.:/-]+)\s*$")
          errors = []
          for block in BLOCK.findall(os.environ.get("BODY") or ""):
              for n, line in enumerate(block.splitlines(), 1):
                  if not line.strip() or line.strip().startswith("#"):
                      continue
                  m = LINE.match(line)
                  if not m:
                      errors.append(f"line {n}: cannot parse `{line.strip()}`")
                  elif m["edge"] in NATIVE:
                      errors.append(f"line {n}: `{m['edge']}` is GitHub-native; use a sub-issue or blocked-by link")
                  elif m["edge"] in KG_ONLY:
                      errors.append(f"line {n}: `{m['edge']}` is set in the knowledge merge step")
                  elif m["edge"] not in ALLOWED:
                      errors.append(f"line {n}: unknown edge `{m['edge']}`")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("errors<<EOF\n" + "\n".join(errors) + "\nEOF\n")
          PY
      - name: Comment
        if: steps.v.outputs.errors != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ERRORS: ${{ steps.v.outputs.errors }}
        run: |
          printf 'The links block has problems:\n\n%s\n\nFormat: `<edge>: <owner>/<repo>#<n>` or `<edge>: kg:<id>`, one per line.\n' "$ERRORS" \
            | gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file -
