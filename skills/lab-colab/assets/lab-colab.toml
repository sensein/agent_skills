# Desired state for a Lab Colab Space.
#
# The bootstrap copies this file into the private meta repo as .colab/config.toml.
# From then on, the meta-repo copy is the source of truth: edit it there by PR
# (`/colab improve`), and `colab.py plan` diffs the org against it.

[org]
name = "sensein"
meta_repo = "lab-colab"          # private: config, ledgers, event snapshots, KG staging
discuss_repo = "lab-colab"       # Discussions live in the meta repo unless split later
forms_repo = ".github"           # org-wide default issue forms; repos with their own templates keep theirs
project_title = "Lab portfolio"
project_number = 0              # 0 = not created yet; the meta repo copy sets the real number

# ---------------------------------------------------------------------------
# Work item types. Each becomes an org-level GitHub issue type plus an issue form.
# Colors must be one of: gray, blue, green, yellow, orange, red, pink, purple.
# ---------------------------------------------------------------------------
[[types]]
name = "Idea"
color = "yellow"
description = "A possibility worth triaging: promote, park, or drop."
fields = [
  { id = "idea", label = "The idea", kind = "textarea", required = true },
  { id = "origin", label = "Where it came from (discussion, paper, finding)", kind = "input", required = false },
]

[[types]]
name = "Question"
color = "purple"
description = "A research question with hypotheses and linked evidence."
fields = [
  { id = "question", label = "Research question", kind = "textarea", required = true },
  { id = "hypotheses", label = "Hypotheses", kind = "textarea", required = false },
]

[[types]]
name = "Experiment"
color = "blue"
description = "Tests a hypothesis; records results with provenance, negative ones too."
fields = [
  { id = "hypothesis", label = "Hypothesis", kind = "textarea", required = true },
  { id = "data", label = "Data (pointers only, never restricted content)", kind = "textarea", required = true },
  { id = "metrics", label = "Metrics, including imbalance-aware ones", kind = "textarea", required = true },
  { id = "compute", label = "Compute plan (partition, GPUs, budget)", kind = "input", required = false },
  { id = "budget", label = "Run budget (iterations=N, wall=2h, loop=30m, compute=GPU-hours, metric=name, direction=higher|lower)", kind = "input", required = false },
  { id = "verify", label = "Verify command (its last stdout line is the metric)", kind = "input", required = false },
]

[[types]]
name = "Review"
color = "green"
description = "A literature review: query, sources, inclusion rule, synthesis."
fields = [
  { id = "query", label = "Search query", kind = "textarea", required = true },
  { id = "sources", label = "Sources", kind = "input", required = true },
  { id = "inclusion", label = "Inclusion rule", kind = "textarea", required = true },
]

[[types]]
name = "Software"
color = "gray"
description = "A software change or project; done when released and documented."
fields = [
  { id = "goal", label = "What it should do", kind = "textarea", required = true },
  { id = "repo", label = "Owning repo", kind = "input", required = true },
]

[[types]]
name = "Model"
color = "orange"
description = "Building or adapting a model; done when evaluated against a baseline, with a card."
fields = [
  { id = "task", label = "Task and data", kind = "textarea", required = true },
  { id = "baseline", label = "Baseline and evaluation set", kind = "textarea", required = true },
]

[[types]]
name = "Infrastructure"
color = "red"
description = "Containers, launchers, runbooks; done when a second person verifies the runbook."
fields = [
  { id = "need", label = "What it enables", kind = "textarea", required = true },
  { id = "runbook", label = "Runbook location", kind = "input", required = false },
]

[[types]]
name = "Dataset"
color = "pink"
description = "Curated data with a datasheet, registered with access terms."
fields = [
  { id = "description", label = "Description (no participant-level detail)", kind = "textarea", required = true },
  { id = "access", label = "Access terms and data-use reference", kind = "input", required = true },
]

[[types]]
name = "Output"
color = "purple"
description = "A paper, preprint, talk, or grant section."
fields = [
  { id = "venue", label = "Venue and deadline", kind = "input", required = true },
  { id = "contributors", label = "Contributors and proposed CRediT roles", kind = "textarea", required = false },
]

[[types]]
name = "Task"
color = "gray"
description = "A unit of work under any item."
fields = [
  { id = "work", label = "What needs doing", kind = "textarea", required = true },
]

# ---------------------------------------------------------------------------
# Typed links. part-of and depends-on are GitHub-native; the rest live in a
# fenced ```links block in the issue body. Empty domain = any work item.
# ---------------------------------------------------------------------------
[edges]
native = ["part-of", "depends-on"]
body = ["addresses", "uses", "produces", "informs", "contributes-to", "derived-from"]
kg_only = ["supersedes", "contradicts", "supports", "refines"]

[edges.domain]
addresses = ["Experiment", "Review"]

# ---------------------------------------------------------------------------
# Labels. `colab.py tag` may set only these and space:<name> labels; add one here by PR to allow it.
# None are created up front. Tier comes from each repo ([tiers] below, else its
# visibility); space membership comes from the repo lists. A label is created
# only on first use, for an exception: one restricted item in a lab repo, or an
# item joining a space its repo is not in. A space:<name> label never changes a tier.
# ---------------------------------------------------------------------------
[[labels]]
name = "tier:restricted"
color = "b60205"
description = "Visibility ceiling: named project members only"
on_demand = true

[labels_space]
color = "5319e7"                 # for space:<name> labels, created on first use

# Project v2 fields. gh creates TEXT, SINGLE_SELECT, DATE, NUMBER; the plan creates
# MULTI_SELECT and ITERATION through GraphQL (2-week cycles from next Monday, 4 of them).
# Spaces is multi-select and its options come from [spaces] at plan time: the bus keeps
# each item's value (repo membership plus space:<name> labels) and every `Space: <name>`
# view filters on it, because a view filter cannot OR "repo is X" with "label is Y".
[[fields]]
name = "Status"
type = "SINGLE_SELECT"
options = ["Proposed", "Accepted", "Ready", "In progress", "Blocked", "Review", "Done", "Parked", "Dropped"]

[[fields]]
name = "Sensitivity"
type = "SINGLE_SELECT"
options = ["public", "lab", "restricted"]

[[fields]]
name = "Agent-ready"
type = "SINGLE_SELECT"
options = ["yes", "no"]

[[fields]]
name = "Lead"
type = "TEXT"

[[fields]]
name = "Risk"
type = "SINGLE_SELECT"
options = ["high", "medium", "low"]

[[fields]]
name = "Target date"
type = "DATE"

[[fields]]
name = "KG link"
type = "TEXT"

[[fields]]
name = "Contributions"           # kept by the bus for external items: "kabilar: fix, review; satra: comment"
type = "TEXT"

[[fields]]
name = "Security"                # injection-scan gate: the bus sets flagged; a steward or the item's Lead clears it
type = "SINGLE_SELECT"           # (`colab.py security clear`). Empty = unreviewed. next, claim and run skip flagged items
options = ["unreviewed", "flagged", "cleared"]

[[fields]]
name = "Spaces"
type = "MULTI_SELECT"            # options = the names in [spaces]; never listed here

[[fields]]
name = "Iteration"
type = "ITERATION"

# ---------------------------------------------------------------------------
# Spaces: membership by repo list (the bus writes the Spaces field). Empty here on purpose; the bootstrap proposes
# one per active repo and the lab edits the list in the meta-repo copy.
# ---------------------------------------------------------------------------
[spaces]
# A space is a named area of work: a project, a theme, or shared infrastructure.
# It is not a repo or a folder: just this entry. Items in the listed repos belong
# to the space; spaces may share repos. Stewards (one or more) accept proposals
# and name a Lead per item. Tiers are per repo: see [tiers] below, not here. (An older
# space-level tier = "restricted" still tightens that space's repos, and `plan` asks you to
# move it to [tiers].)
# example-space = { stewards = ["handle-a", "handle-b"], repos = ["repo-a", "repo-b"] }
#
# External repos the group contributes to may be listed as "owner/name" (bare names stay in [org] name).
# They are tracked read-only: the bus adds their items to the Project (see [bus] external_track) and
# never writes there. A non-public external repo counts as restricted unless [tiers] lab lists it;
# one you or the bus cannot read is skipped. Their labels never drive routing or Spaces. Keep the
# Project private: adding an external issue shows an "added to project" event on that issue.
# example-upstream = { stewards = ["handle-a"], repos = ["repo-a", "upstream-org/library"] }

# ---------------------------------------------------------------------------
# Tiers per repo. A repo's tier is its entry here, else its visibility (public -> public,
# private/internal -> lab). An external repo that is not public is restricted unless listed in `lab`.
# An item's tier is its repo's tier, tightened by a tier:* label; a space:<name> label never changes it.
# Entries use the [spaces] grammar: bare names are in [org] name, "owner/name" elsewhere.
# ---------------------------------------------------------------------------
[tiers]
restricted = []                  # e.g. ["sailsprep", "sails_action_classification"]
lab = []                         # opt-in for external non-public repos, e.g. ["partner-org/private-tool"]

# ---------------------------------------------------------------------------
# Groups, for contexts (`next --group <name>`, brief, credit). members = "org:<org>", "team:<org>/<team>",
# or a list of logins; read from GitHub with your own login and cached for a day. external = true (or an
# org other than [org] name) makes a group external: read-only, its content untrusted. `lab` defaults to
# members of [org] name even when not listed. A context narrows what is in scope; it never widens rights.
# ---------------------------------------------------------------------------
[groups]
lab = { members = "org:sensein" }
# pydra = { members = "team:nipype/pydra-maintainers", external = true }
# reviewers = { members = ["handle-a", "handle-b"] }

# ---------------------------------------------------------------------------
# Rollout. Phase 0 reaches every space with low-risk parts only. Switches open
# per space after that space passes the previous gate.
# ---------------------------------------------------------------------------
[[phases]]
id = 0
name = "Foundation"
gate = "Leak scan finds every seeded case (selftest) and reports 0 findings on the meta repo; every space's repos are covered by the Spaces field and its Space: <name> view, and show the org-wide colab forms or keep their own templates (labels are created on first use, never up front); bus runs in dry-run with a fresh heartbeat."

[[phases]]
id = 1
name = "Distill + sessions"
gate = "Each space completes one cycle: distill -> claim -> PR -> handoff, with the lease honoured."
switches = ["bus_live"]

[[phases]]
id = 2
name = "Knowledge + routing"
gate = "50 accepted knowledge nodes; BrainKB sandbox round trip verified; catch-up under 2 minutes."
switches = ["agent_proposals", "auto_intake", "restricted"]

[[phases]]
id = 3
name = "Self-evolution"
gate = "An improve PR merged with a measured gain; cost per task reported against a Claude-only baseline."
switches = ["self_improve"]

# ---------------------------------------------------------------------------
# Leak scan. Point `command` at the lab's own scanner if it has one; it must
# print a JSON object of category -> count. Otherwise the built-in patterns run.
# ---------------------------------------------------------------------------
[scan]
command = ""
injection_command = ""           # optional model hook for `scan --injection` and the bus: reads text on stdin,
                                 # prints {"flag": bool, "reason": str}. Never required; the built-in rules always run
[scan.patterns]
secret = ['ghp_[A-Za-z0-9]{36}', 'github_pat_[A-Za-z0-9_]{40,}', 'sk-ant-[A-Za-z0-9_-]{20,}', 'AKIA[0-9A-Z]{16}', '-----BEGIN [A-Z ]*PRIVATE KEY-----']
path = ['''/orcd/(?:scratch|data|pool|home)/[^\s"']+''', '/home/[a-z][a-z0-9_-]+/']
participant_id = []   # add the lab's participant-ID formats in the meta-repo copy

[sessions]
# Session heartbeats. Claude Code hooks call `colab.py beat`; see SKILL.md.
issue = 0                        # number of the "Session activity" issue in the meta repo (0 = not created yet)
lease_minutes = 45               # a claim lapses this long after the session's last beat
beat_min_seconds = 600           # at most one GitHub write per session per this many seconds
stale_minutes = 60               # no beat this long, and no running Slurm job: the session is stale

[run]
# `/colab run`: where runs live and how often progress is posted on the Experiment issue.
root = ""                        # runs root; empty = ${XDG_STATE_HOME:-~/.local/state}/lab-colab/runs
python = ""                      # interpreter job.sbatch calls for restricted runs (3.11+); empty = the one that ran `start`
mode = "auto"                    # workspace: auto (git worktree when the source is a repo, else a copy), worktree, or dir
comment_every = 5                # compact progress comment every N iterations; 0 = off
comment_every_seconds = 0        # or every N seconds (0 = off)

[bus]
poll_seconds = 300
write_interval_seconds = 1.0     # stay under GitHub's content-creation limits
fanout_digest_threshold = 20     # above this many subscribers, write one digest issue
heartbeat_stale_minutes = 30
project_sync = true              # keep the org Project's Spaces field current (board bookkeeping, runs in dry-run spaces too)
project_sync_every = 6           # full Project sweep every N polls; newly opened items are added immediately
project_add = ["issue"]          # kinds the bus adds to the Project when opened: "issue", "pull_request". Issues only keeps PRs off the board
external_track = "involved"     # external space repos: "involved" = items an org member opened, commented on, reviewed, or fixed
                                 # (a closing PR; assignment or a bare mention does not count); "all" = every item
external_detail_per_poll = 50    # external items whose comments/reviews/timeline are read per poll (only items updated since
                                 # the cursor); the rest carry over to the next poll
injection_scan = true            # scan new or edited bodies and comments; a hit sets the Project field Security = flagged
drift_check_hours = 24           # read-only observe + plan this often; opens or updates one "Drift report" issue in the meta repo when the org no longer matches this config. 0 = off. Never applies anything

[security]
audit_issue = 0                  # meta-repo issue that `colab.py security clear` comments on (who, when, why); 0 = local audit file only

# ---------------------------------------------------------------------------
# Optional private plugin marketplace: one plugin per skill folder of source_repo, synced into
# claude.ai as an org marketplace. `colab.py plan` creates the repo, sets its Actions permissions,
# and proposes `seed-marketplace`. repo = "" (the default) leaves it off.
# ---------------------------------------------------------------------------
[marketplace]
repo = ""                        # e.g. "claude-plugins" (private); "" = off
source_repo = "agent_skills"     # public repo whose skills/ folders become plugins
exclude = []                     # skill folder names to leave out
name = "sensein"                 # marketplace name (what `plugin install <skill>@<name>` uses)
