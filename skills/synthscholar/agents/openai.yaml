interface:
  display_name: "SynthScholar PRISMA Reviews"
  short_description: "Scope, run, and audit PRISMA systematic reviews — including over PDFs you supply"
  default_prompt: "Use $synthscholar to scope a PRISMA review protocol, run the review over the PDFs I supply (fetching anything I only have a DOI for — open access first, then my own institutional EZproxy access), and export Markdown plus SLR-ontology Turtle with full retrieval and screening provenance."

  # What the skill can actually do, for a chooser deciding whether to invoke it.
  capabilities:
    - "Draft and gate a complete review protocol from a one-line research question"
    - "Run the full PRISMA pipeline over user-supplied PDFs: screening, charting, appraisal, synthesis, per-group analysis"
    - "Retrieve missing full texts from a DOI — open access (Unpaywall/OpenAlex/Semantic Scholar), then institutional EZproxy"
    - "Read every paper in full and extract only that paper's own findings, not the claims it cites"
    - "Screen eligibility on full text, recording what each decision was actually judged on"
    - "Export md, ttl (SLR ontology), jsonld, json, bib, charting, appraisal, per-group, narrative"
    - "Add or amend the search strategy after a run and re-export"
    - "Query a finished review over SPARQL (14 recipes) or SQL (8) for retrieval and screening provenance"
    - "Produce the review without an OpenRouter key, with the host model authoring it through the same exporters"

policy:
  allow_implicit_invocation: true

dependencies:
  # Installed with pip. Only what a given script needs is required — see the
  # per-script table below and the README.
  python:
    - "rdflib>=6.0"          # SPARQL over an RDF export (query_sparql.py)
    - "httpx>=0.25"          # open-access + institutional retrieval (fetch_ezproxy.py), registry lookups (verify_citations.py)
    - "pymupdf>=1.24"        # PDF text extraction (build_corpus.py)
    - "docling"              # first extraction backend in build_corpus.py (tables + OCR)
    - "psycopg[binary]>=3.1" # article-store queries (query_postgres.py, backfill)
    - "pydantic>=2.0"        # result validation (export_review.py)
    - "playwright"           # library sign-in in a browser (fetch_ezproxy.py, paywalled papers only)

  # Not pip packages: command-line tools generate_review_pdf.py shells out to.
  # Check with `python scripts/generate_review_pdf.py --check-deps`.
  system:
    pandoc: "required for PDF — conda install -c conda-forge pandoc | brew install pandoc | apt-get install pandoc"
    pdf_engine: "one of xelatex, lualatex, tectonic, pdflatex, typst, weasyprint, wkhtmltopdf, prince — lightest: conda install -c conda-forge typst (or tectonic)"
    fc-list: "optional; picks a Unicode font for TeX engines — part of fontconfig (brew install fontconfig | apt-get install fontconfig)"

  # The package this skill drives is vendored: vendor/synthscholar (see
  # vendor/VENDORED.md). Nothing is installed from the application repository;
  # PyPI's synthscholar 0.0.11 predates features the skill needs and is not used.
  synthscholar:
    vendored: "vendor/synthscholar — part of the skill, imported first by the scripts"
    libraries: "pip install -r requirements.txt"

  # Which scripts need which of the above.
  scripts:
    validate_protocol.py: "stdlib only (PyYAML optional, for .yaml protocols)"
    build_corpus.py: "docling first (tables + OCR, the only backend that reads a scanned PDF), then pymupdf, pypdf, the pdftotext CLI; --no-docling skips it"
    fetch_ezproxy.py: "httpx; open access needs no credentials; institutional access signs in through a browser (playwright) — no EZPROXY_* setup"
    ezproxy_login.py: "playwright + Chrome/Edge (or playwright's Chromium); saves the session under ~/.config/synthscholar"
    oa_client.py: "httpx; vendored Unpaywall/OpenAlex/Semantic Scholar DOI chain, imported by fetch_ezproxy.py"
    ezproxy_client.py: "httpx; vendored EZproxy client, used when synthscholar.ezproxy is absent"
    run_local_review.py: "vendored synthscholar + requirements.txt + OPENROUTER_API_KEY"
    export_review.py: "vendored synthscholar + requirements.txt"
    update_provenance.py: "synthscholar (models only)"
    check_writing.py: "stdlib only"
    review_figures.py: "stdlib only (SVG)"
    assemble_manuscript.py: "stdlib only"
    verify_citations.py: "httpx; Crossref, doi.org, NCBI E-utilities — no credentials"
    prisma_flow.py: "stdlib for the SVG; rsvg-convert, cairosvg or typst for the PDF a TeX engine embeds"
    generate_review_pdf.py: "pandoc + one engine (xelatex, lualatex, tectonic, pdflatex, typst, weasyprint, wkhtmltopdf, prince); stdlib otherwise"
    query_sparql.py: "rdflib"
    query_postgres.py: "psycopg[binary]"
    backfill_full_text.py: "psycopg[binary] + synthscholar, migration 006 applied"

  environment:
    OPENROUTER_API_KEY: "required by run_local_review.py; unused by the other scripts"
    SYNTHSCHOLAR_EMAIL: "polite-pool contact; Unpaywall requires it (ToS) and is skipped without it"
    NCBI_API_KEY: "optional; raises the PubMed E-utilities rate limit for verify_citations.py"
    SEMANTIC_SCHOLAR_API_KEY: "optional; lifts Semantic Scholar's 1 req/s public rate limit"
    EZPROXY_HOST: "optional manual override — the browser sign-in finds and saves the proxy itself"
    EZPROXY_COOKIE_FILE: "browser-exported cookies.txt for that proxy (or EZPROXY_COOKIE)"
    EZPROXY_MODE: "hostname-suffix (default) or login-url"
    EZPROXY_DELAY: "seconds between proxied requests (default 3)"
    EZPROXY_MAX_REQUESTS: "per-run ceiling on proxied requests (default 100)"
    SYNTHSCHOLAR_PG_DSN: "optional; only for the article-store query scripts"
